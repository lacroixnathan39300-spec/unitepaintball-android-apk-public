name: Compiler Android 2.2.72 (branche ci)
on:
  push:
    branches: ['ci/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Installer le SDK Android 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Compiler l'APK de débogage
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Tests harnais (synchronisation hors ligne)
        working-directory: harness
        run: bash ./run.sh ../app/src/main/java/com/unitepaintball/app
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: UnitePaintball-2.2.72-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
      - name: Publier l'APK dans le dossier apk/ de la branche
        if: success()
        run: |
          mkdir -p apk
          cp app/build/outputs/apk/debug/app-debug.apk apk/UnitePaintball-2.2.72-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk
          git commit -m "APK debug 2.2.72 [skip ci]" && git push origin "HEAD:${GITHUB_REF_NAME}"
